[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pagewielder"
description = "A tool for manipulating PDFs"
dynamic = ["version"]
readme = "README.md"
authors = [{ name = "Henry Till", email = "henrytill@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["pikepdf>=7.1.2"]

[project.optional-dependencies]
dev = ["mypy>=1.8.0", "ruff>=0.6.0"]

[project.scripts]
pagewielder = "pagewielder.__main__:main"

# version.py appends the git reference to the base version in VERSION.  The result goes into the package metadata,
# where pagewielder/__init__.py reads it, rather than into a generated file the type checkers would need to exist.
[tool.hatch.version]
source = "code"
path = "version.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# flake8's checks (pycodestyle and pyflakes), isort's, pylint's and pydocstyle's.
select = ["E", "W", "F", "I", "PL", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["pagewielder", "tests", "version.py"]
check_untyped_defs = true
warn_redundant_casts = false

[tool.pyright]
# The same sources as mypy's files; without them pyright walks the whole tree, ./result's installed copy included.
include = ["pagewielder", "tests", "version.py"]
typeCheckingMode = "strict"
